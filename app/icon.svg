<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Danumai">
  <defs>
    <!-- the brand jewel gradient: electric indigo → violet → magenta -->
    <linearGradient id="danu-g" x1="16" y1="6" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f5cf0"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#d12f97"/>
    </linearGradient>
    <linearGradient id="danu-sheen" x1="50" y1="3" x2="50" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- soft depth so the white glyph floats off the glass -->
    <filter id="danu-depth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#2a0d40" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- one roof: the gradient squircle that houses every venture -->
  <rect x="4" y="4" width="92" height="92" rx="27" fill="url(#danu-g)"/>
  <rect x="4" y="4" width="92" height="92" rx="27" fill="url(#danu-sheen)"/>

  <g filter="url(#danu-depth)">
    <!-- the D — even-weight geometric ring, counter open as an aperture -->
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#ffffff"
      d="M31 27 H48.5 C62.6 27 74 37.3 74 50 C74 62.7 62.6 73 48.5 73 H31 Z
         M44 40 V60 H48.5 C55.4 60 61 55.5 61 50 C61 44.5 55.4 40 48.5 40 Z"/>
    <!-- the signal: 'Danumai.' — a full stop, ringed so it reads on the magenta corner -->
    <circle cx="80.5" cy="70" r="7.4" fill="#ffffff" opacity="0.92"/>
    <circle cx="80.5" cy="70" r="6" fill="#e0402f"/>
  </g>

  <!-- lit-glass rim -->
  <rect x="4.7" y="4.7" width="90.6" height="90.6" rx="26.3" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2"/>
</svg>
